<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ごみ収集検索｜霞ノ杜町</title>
  <meta name="description" content="ごみ収集検索 — 霞ノ杜町公式。【フィクション】">
  <link rel="stylesheet" href="../css/city-common.css">
  <link rel="stylesheet" href="../css/city-gate.css">
  
  <script src="../js/kasumi-gate-head.js"></script>
  <script src="../token-gate.js" defer></script>
</head>
<body class="city-body">
<div id="site-root">
  <div data-city-include="header"></div>
  <div data-city-include="tools"></div>
  <div class="city-page-wrap">
    <main class="city-page" id="city-main">
      <nav class="city-breadcrumb" aria-label="パンくず"><a href="../">トップ</a> &nbsp;›&nbsp; <a href="index.html">くらし・環境</a> &nbsp;›&nbsp; ごみ収集検索</nav>
      <h1>ごみ収集検索</h1>
      <p>町内区分コード（7桁・フィクション）を入力して収集曜日を表示します。</p>
      <p><label>区分コード <input id="gomi-zip" type="text" maxlength="7" placeholder="0291701"></label> <button type="button" id="gomi-go">検索</button></p><p id="gomi-out"></p><p>例: 0291701（三日月） / 0291702（霞ノ杜） / 0291703（杉並ヶ岡）</p>
      <aside class="city-related"><h2>関連するページ</h2><ul><li><a href="gomi.html">収集曜日</a></li><li><a href="kankyo.html">環境</a></li><li><a href="../contact/">問合せ</a></li><li><a href="index.html">くらし</a></li></ul></aside>
    </main>
  </div>
  <div data-city-include="footer"></div>
</div>
<script src="../js/site-include.js" data-base="../" defer></script>
<script src="../js/kasumi-footprint.js" defer></script>

<script>
(function(){
  var map = { "0291701": "三日月町中心 — 燃やす:火・金", "0291702": "霞ノ杜 — 燃やす:月・木", "0291703": "杉並ヶ岡 — 燃やす:火" };
  var btn = document.getElementById("gomi-go");
  var out = document.getElementById("gomi-out");
  if (btn) btn.addEventListener("click", function(){
    var v = (document.getElementById("gomi-zip") || {}).value || "";
    out.textContent = map[v.trim()] || "該当する収集区分が見つかりません。町役場へお問い合わせください。";
  });
})();
</script>
</body>
</html>
